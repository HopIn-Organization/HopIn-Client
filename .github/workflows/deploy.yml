name: Deploy Client

on:
  push:
    # `deployment` is a temporary trigger for testing the pipeline itself
    # before relying on it for real main-branch releases. Remove it once
    # you're confident and just deploy off `main`.
    branches: [main, deployment]
  workflow_dispatch: {}

concurrency:
  group: hopin-client-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, hopin-prod]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_DATA_SOURCE: ${{ vars.VITE_DATA_SOURCE }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Deploy static build to nginx web root
        run: rsync -a --delete dist/ /var/www/hopin-client/
